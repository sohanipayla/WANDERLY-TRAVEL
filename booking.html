<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking | Wanderly</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/style.css"></head><body class="bg-slate-50"><header class="bg-white border-b"><div class="max-w-7xl mx-auto px-5 py-4"><a href="index.html" class="text-2xl font-black">WANDERLY</a></div></header><main class="max-w-3xl mx-auto px-5 py-16"><p class="text-sky-600 font-bold">RESERVATION</p><h1 id="bookingTitle" class="text-5xl font-black mt-2">Complete Your Booking</h1><form id="bookingForm" class="bg-white p-7 rounded-3xl shadow-sm mt-8 grid md:grid-cols-2 gap-5"><input required class="border rounded-xl px-4 py-3" placeholder="Full name"><input required type="email" class="border rounded-xl px-4 py-3" placeholder="Email"><input required type="date" class="border rounded-xl px-4 py-3"><input required type="number" min="1" value="2" class="border rounded-xl px-4 py-3"><textarea class="border rounded-xl px-4 py-3 md:col-span-2 h-32" placeholder="Special requests"></textarea><button class="md:col-span-2 bg-sky-600 text-white py-3 rounded-xl font-bold">Confirm booking</button></form><div id="success" class="hidden mt-5 bg-emerald-50 text-emerald-700 p-5 rounded-2xl">Booking request received! This is a frontend demo.</div></main><script src="js/data.js"></script><script src="js/booking.js"></script></body></html>
